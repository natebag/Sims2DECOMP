  - addr: "0x802860AC"
    size: 56
    symbol: "AptArray::get(int) const"
    category: 3
    source: "src/matched/agent/match_0x802860AC_AptArray__get.cpp"
    diagnosis: "cc1plus -O2 tail-merges the gpAptUndefined-return tail into a single shared block (12 inst / 48B); SN ProDG keeps the tail duplicated (14 inst / 56B), gaining +2 inst / +8B. Source-level coaxing insufficient — layout choice is independent of source structure. Cracked via `anti_tail_merge` mutator: invert BO=4 anchor branch (idx>=count) + retarget BO=12 also_retarget (idx<0) + insert duplicated tail block, leaving original .L7 at function end to receive the bclr fallthrough."
    pipeline:
      - mutator: anti_tail_merge
        args:
          tail_label: ".L7"
          anchor_branch: "bc 4,0,.L7"
          also_retarget: "bc 12,0,.L7"
    expected: match           # cracked 2026-05-02 by MutatorSmith — anti_tail_merge canonical primary (commit 0c5e1dd4); STANDARD-ship N=1 byte-match.

  - addr: "0x8028552C"
    size: 80
    symbol: "AptActionQueueC::GetDequeLocation(int) const"
    category: 2
    source: "src/matched/aptactionqueuec/match_0x8028552C_AptActionQueueC__GetDequeLocation.cpp"
    diagnosis: "Pure register-coloring residual after `if (wrapped >= 0)` source polarity flip aligns block layout with DOL. cc1plus colors the post-mullw `wrapped` value r0 throughout; DOL kills r0 to r3 at the `srawi 0,0,2` shift and reuses r0 for the divw quotient. 7 mismatches (offsets 0x1c..0x44) collapse to a single directed bounded-region register rename. start_anchor=`srawi 0,0,2` (kill point — start_mode='at' renames dest only); end_anchor=`mulli 3,0,20` (last region line, end_mode='at'); rename=`0:3,9:0` simultaneous map (3 silent-identity)."
    pipeline:
      - mutator: region_gpr_relabel
        args:
          start_anchor: "srawi 0,0,2"
          end_anchor: "mulli 3,0,20"
          rename: "0:3,9:0"
    expected: match           # cracked 2026-05-02 by MutatorSmith — region_gpr_relabel canonical primary (Track I queue #3); STANDARD-ship N=1 byte-match.

  - addr: "0x800B69D4"
    size: 132
    symbol: "FamilyImpl::RemoveMember(int)"
    category: 3
    source: "src/matched/familyimpl/match_0x800B69D4_FamilyImpl__RemoveMember.cpp"
    diagnosis: "Asymmetric register rename + missing `mr` insertion in the shift-loop prep block. cc1plus puts src into r10 (`addi 10,9,4`) and m_end into r0 (`lwz 0,4(3)`) with shape (subf ; mr ; ...); DOL puts src into r0 first then explicitly moves to r11 (`mr 11,0`), m_end into r8, and orders the prep block as (mr 11,0 ; mr 10,9 ; subf 0,11,8). The `subf 0,10,0` line has r0 at BOTH rt and ra positions; after insert_mr's r10↔r11 relabel cascade rewrites it to `subf 0,11,0`, the rt r0 must STAY r0 while only the ra r0 must become r8. force_reg whole-line rewrite would clobber rt — needs position-aware rename. 7-directive recipe: 3 force_reg (addi/lwz/cmpw register coercion) + 1 swap_operands (cmpw rA/rB swap) + 1 swap_adj (subf/mr reorder pre-insert) + 1 insert_mr (with bidirectional relabel 10:11,11:10) + 1 force_reg_at_pos (post-cascade ra rename on subf line)."
    pipeline:
      - mutator: force_reg
        args: {match: "addi 10,9,4", from_reg: "10", to_reg: "0"}
      - mutator: force_reg
        args: {match: "lwz 0,4(3)", from_reg: "0", to_reg: "8"}
      - mutator: swap_operands
        args: {match: "cmpw 0,10,0", pos: "1,2"}
      - mutator: force_reg
        args: {match: "cmpw 0,0,10", from_reg: "10", to_reg: "8"}
      - mutator: swap_adj
        args: {a: "subf", b: "mr", which: "first"}
      - mutator: insert_mr
        args: {after: "# beq  cr0", src: "0", dst: "11", relabel: "10:11,11:10"}
      - mutator: force_reg_at_pos
        args: {match: "subf 0, 11, 0", pos: "2", from_reg: "0", to_reg: "8"}
    expected: match           # cracked 2026-05-02 by MutatorSmith — force_reg_at_pos canonical primary (Track I queue #4); STANDARD-ship N=1 byte-match. Lane O closure cascade — force_reg_at_pos PROVISIONAL → STANDARD.

  - addr: "0x8021E6E0"
    size: 76
    symbol: "InteractorModule::SimInteractor::ImmediatelyCutCursorAndCameraToPos(EVec3*)"
    category: 2
    source: "src/matched/agent/match_0x8021E6E0_InteractorModule__SimInteractor__ImmediatelyCutCursorAndCame.cpp"
    diagnosis: "Compiler-version scheduler divergence: DOL's SN ProDG uses 'cascade displacement' when mr r9,r4 (pos_copy) is inserted — x is displaced from r9 and takes cp's old r11 slot, cp moves to r8 (x->r11, y->r10, z->r0). Our SN ProDG uses 'grab-available' — x grabs the first free r0, producing a cyclic rotation x->r0, y->r11, z->r10. Store order is also wrong due to the register pressure difference. Two-directive fix: (1) region_gpr_relabel cyclic rename {r0->r11, r11->r10, r10->r0} over the 6-instruction load/store region, (2) swap_adj stw/stw which=last to reorder cp[2]=z before cp[1]=y."
    pipeline:
      - mutator: region_gpr_relabel
        args:
          start_anchor: "lwz 0,0(9)"
          end_anchor: "stw 10,8(8)"
          rename: "0:11,11:10,10:0"
      - mutator: swap_adj
        args:
          a: stw
          b: stw
          which: last
    expected: match           # cracked 2026-05-23 by SonnetWorker2 — region_gpr_relabel+swap_adj composition (N=1 for cyclic rename variant).
