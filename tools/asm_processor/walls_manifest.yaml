# walls_manifest.yaml — Wall catalog for the asm_processor regression harness.
#
# Each entry captures a known parked wall that asm_processor should eventually
# crack. The harness uses this as its test input list.
#
# Schema per wall entry:
#   addr:     hex address of the function start (matches DOL + DVD map)
#   size:     function size in bytes (must equal DVD map size)
#   symbol:   mangled/demangled symbol name (human-readable; for reports)
#   category: 1 = adjacent-insn swap, 2 = register allocation, 3 = RTL hoist / CFG
#   source:   relative path to the C++ file that asm_processor will compile
#   diagnosis: short note on the observed mismatch
#   pipeline: ordered list of mutators to apply (each entry: mutator + args)
#   expected: 'match' (harness asserts full MATCH), 'improve' (accept any byte
#             improvement over baseline), or 'park' (harness just records
#             current state, does not fail the suite yet).
#
# Category 1 walls are expected to crack first (simplest swaps). Category 3
# walls likely need Phase 2 mutator work or remain structural.

walls:
  - addr: "0x80224048"
    size: 24
    symbol: "InteractorModule::WallManipulator::GetAffectedWallHeight()"
    category: 1
    source: "tools/asm_processor/walls/wall_0x80224048_GetAffectedWallHeight.cpp"
    diagnosis: "lfs-vs-andi RTL hoist — SN scheduler emits `lfs` first; DOL wants `andi.` first, so swap the adj (lfs, andi.) pair."
    # Directives are embedded in the source (// ASMPROC_*). Pipeline mirrored
    # here for harness introspection only; asm_processor.py is the source of truth.
    pipeline:
      - mutator: swap_adj
        args:
          a: "lfs"
          b: "andi."
          which: first
    expected: match         # cracked 2026-04-21 (S13 Track I pioneer).

  - addr: "0x8001A03C"
    size: 56
    symbol: "ESimsCam::GetCursorLimitTopWidth()"
    category: 2
    source: "tools/asm_processor/walls/wall_0x8001A03C_ESimsCam_GetCursorLimitTopWidth.cpp"
    diagnosis: "FP-register coloring — SN picks f0/f12/f13/f11 where DOL picks f13/f11/f0/f12. Atomic bidirectional relabel (0:13,11:12) across the fmadds chain."
    pipeline:
      - mutator: fp_relabel
        args: {swap: "0:13,11:12"}
    expected: match           # cracked 2026-04-21 by OpusWorker (Phase 2 wall #2).

  - addr: "0x80204FD8"
    size: 60
    symbol: "InteractorModule::DirectInteractor::CheckCancelTimer()"
    category: 1
    source: "tools/asm_processor/walls/wall_0x80204FD8_CheckCancelTimer.cpp"
    diagnosis: "two-pair reorder — SN originally emits (stfs, lfs_thresh, fcmpu); DOL wants (lfs_thresh, fcmpu, stfs). Cracked via source-level preload of thresh into a named local, which both forces the early load AND lets GCC allocate a distinct FP register for it. No asm-processor directive needed."
    pipeline: []
    expected: match           # cracked 2026-04-21 by OpusWorker (source-side).

  - addr: "0x8027AB3C"
    size: 112
    symbol: "AptActionInterpreter::_FunctionAptActionStackSwap()"
    category: 1
    source: "tools/asm_processor/walls/wall_0x8027AB3C_AptActionInterpreter_StackSwap.cpp"
    diagnosis: "Banned-pin-free rewrite compiles at 112B (size matches DOL). ~16 mismatched bytes concentrated in: (a) stack-pointer load reg (DOL r0, SN r11 at offset 0x04); (b) scaled-index mul/add reg allocation at offsets 0x10-0x14; (c) stack2 load reg at offset 0x44 (DOL r10, SN r11); (d) stwx index-reg choice at offsets 0x48/0x58 (DOL alternates r11/r10 for the base and sp4 field, SN always picks r0). Needs a mix of gpr_relabel and possibly swap_adj on the mul/add pairs."
    pipeline: []             # awaits directive authoring (Phase 2 stretch or Phase 3).
    expected: park

  - addr: "0x8027F924"
    size: 128
    symbol: "AptActionInterpreter::_FunctionAptActionPushStringDictByte()"
    category: 1
    source: "tools/asm_processor/walls/wall_0x8027F924_AptActionInterpreter_PushStringDictByte.cpp"
    diagnosis: "Banned-pin-free rewrite compiles at 128B (matches DOL size) with only 3 diff offsets at 0x48 (slwi) and 0x50 (stwx). GCC emits `slwi r0, r9, 2` + `stwx r8, r7, r0`; DOL has `slwi r11, r9, 2` + `stwx r8, r11, r7`. Difference is both a register swap r0↔r11 AND an operand-reorder (rA↔rB on stwx). Single force_reg swap reaches 7d07592e but needs 7d0b392e — requires a new operand-reorder mutator to flip rA/rB slots of a matched stwx. Otherwise tractable via more complex source coaxing to nudge GCC into picking r11 as the scaled-index register."
    pipeline:
      - mutator: force_reg
        args: {swap: "0:11"}
    expected: match           # MATCHED via 3-pass force_reg (commit 2ea1c736).

  - addr: "0x8012B5A0"
    size: 52
    symbol: "cXPersonImpl::InvalidateRoutes()"
    category: 2
    source: "tools/asm_processor/walls/wall_0x8012B5A0_cXPersonImpl_InvalidateRoutes.cpp"
    diagnosis: "array base-alias — DOL picks r11 for base, cc1plus picks r3. May need a gpr_relabel sibling to fp_relabel if the r3 reuse cascades like the fmadds case."
    pipeline: []             # OpusWorker authoring — directive will land in wall source.
    expected: park

  - addr: "0x8012B1D4"
    size: 48
    symbol: "cXPersonImpl::IsDog()"
    category: 2
    source: "src/wip/cxpersonimpl/match_0x8012b1d4_cXPersonImpl__IsDog.cpp"
    diagnosis: "register-pin — vtable/offset loads use non-DOL registers."
    pipeline: []            # To be authored after we capture baseline .s.
    expected: park

  - addr: "0x8004A060"
    size: 48
    symbol: "BBI::InventoryItem::InventoryItem()"
    category: 2
    source: "tools/asm_processor/walls/wall_0x8004A060_BBI_InventoryItem_ctor.cpp"
    diagnosis: "Cracked source-side: (a) extern VT[] forces lis+addi for the vtable; (b) store the field0[0..2] bytes BEFORE field3 + field4 in source — GCC reorders them naturally into DOL's desired (field3, field4, field0[0..2]) emission order AND allocates r0 for byte stores + r10 for the word store."
    pipeline: []
    expected: match           # cracked 2026-04-21 by SonnetWorker2 (Phase 2 wall #4).

